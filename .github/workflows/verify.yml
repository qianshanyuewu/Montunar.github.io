name: Verify blog
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test:authoring
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:performance
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: blog-verification
          path: |
            playwright-report/
            test-results/
            docs/performance-results.json
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: static-site-preview
          path: dist/
